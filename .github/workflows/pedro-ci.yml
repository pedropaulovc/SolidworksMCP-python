name: pedro-ci

# Fork-only supplementary CI. Runs on the `personal` branch and any
# `pedro/**` topic branch. The upstream `ci.yml` workflow still runs
# alongside this — pedro-ci is additive, not a replacement.
#
# Differences from upstream ci.yml:
#   - Cross-platform matrix (Linux + Windows) — catches the Linux-CI
#     regressions that Windows-only test runs miss (see memory:
#     feedback_test_cross_platform).
#   - pip-based install (faster than the upstream conda flow).
#   - Skips the UI test tree to keep the loop tight.
#   - Skips solidworks_only and smoke tests by default.
#
# Why no lint step: upstream ci.yml does not lint (it runs `make test`),
# so personal's ruff debt — 122 pre-existing errors at last count —
# should be cleaned up in an explicit pass, not enforced as a per-PR
# gate that blocks unrelated work. Run `ruff check src tests` locally
# or in a one-shot cleanup branch when ready.
#
# Why --no-cov on pytest: this narrower mock run excludes the UI tree and
# live-SW tests. ci.yml measures the complete mock suite against the 90%
# authored-code threshold. Both workflows separately verify the exact generated
# binding artifact; neither reports static integrity as native COM execution.
#
# Why --deselect test_find_index_file_none_when_missing: pre-existing
# Windows-only test-isolation bug on personal. The test calls
# `_find_index_file(2099, "tests/.generated/does-not-exist.json")` and
# expects None, but the function falls through to a hardcoded search
# path list including `.generated/docs-index/solidworks_docs_index.json`,
# which other tests in the same pytest session leave behind on Windows.
# Properly fixing it needs either a tmp_path/monkeypatch.chdir wrapper
# or a search_root parameter on the function — out of scope for the
# PRs hitting this gate. Deselecting it here keeps Windows CI honest
# about real regressions until the test is fixed on personal.

on:
  push:
    branches:
      - personal
      - 'pedro/**'
  pull_request:
    branches:
      - personal
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11']
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package (no UI extras)
        shell: bash
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e ".[dev,test]"

      - name: Verify pinned generated binding integrity and API contract
        shell: bash
        run: python -m pytest tests/solidworks_mcp/adapters/test_generated_binding_contract.py --no-cov -q

      - name: Tests (mock-only, skip UI and live SolidWorks)
        shell: bash
        run: |
          python -m pytest tests/ \
            -m "not solidworks_only and not smoke" \
            --ignore=tests/solidworks_mcp/ui \
            --ignore=tests/test_live_sw_regression.py \
            --deselect tests/solidworks_mcp/tools/test_docs_discovery.py::test_find_index_file_none_when_missing \
            --no-cov \
            -q
